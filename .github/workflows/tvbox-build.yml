name: build-tvbox

on:
  schedule:
    # UTC 20:00 / 02:00 / 08:00 -> 北京时间 04:00 / 10:00 / 16:00
    - cron: "0 20,2,8 * * *"
  workflow_dispatch:
  push:
    paths:
      - "tvbox/sources.json"
      - "tvbox/build.py"
      - "tvbox/tools/**"
      - ".github/workflows/tvbox-build.yml"

concurrency:
  group: build-tvbox
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: pip install -r tvbox/requirements.txt

      - name: 抓取与合并
        working-directory: tvbox
        run: python build.py

      - name: 产物验收
        working-directory: tvbox
        run: python tools/validate.py
        continue-on-error: true

      - name: 构建摘要
        run: cat tvbox/report.md >> "$GITHUB_STEP_SUMMARY"

      - name: 提交产物
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tvbox
          if git diff --cached --quiet; then
            echo "产物无变化"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore(tvbox): rebuild $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # jsDelivr 按分支缓存 12 小时，推送后主动清理，避免手机端拿到旧配置
      - name: 刷新 CDN 缓存
        if: steps.commit.outputs.changed == 'true'
        run: |
          sleep 10
          for f in api/all.json index.json; do
            code=$(curl -sS -o /dev/null -w "%{http_code}" \
              "https://purge.jsdelivr.net/gh/josephgg/source@main/tvbox/$f" || echo "ERR")
            echo "$f -> $code"
          done
