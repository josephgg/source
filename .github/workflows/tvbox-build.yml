name: build-tvbox

on:
  schedule:
    # UTC 20:00 / 02:00 / 08:00 -> 北京时间 04:00 / 10:00 / 16:00
    - cron: "0 20,2,8 * * *"
  workflow_dispatch:
  push:
    paths:
      - "tvbox/sources.json"
      - "tvbox/build.py"
      - "tvbox/rule_health.json"
      - "tvbox/play_health.json"
      - "tvbox/tools/**"
      - "tvbox/joetv/**"
      - ".github/workflows/tvbox-build.yml"

concurrency:
  group: build-tvbox
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 安装依赖
        run: pip install -r tvbox/requirements.txt

      - name: 搜索质量实测（24 小时缓存）
        working-directory: tvbox
        # 使用上一轮接口清单探测；新接口最迟下一轮纳入。构建阶段会按归一化 API
        # 把结论覆盖到同后端别名，不能只测 lite 里的单个 key。
        run: python tools/probe_search.py --file api/all.json --workers 16 --merge --max-age 86400

      - name: 规则站体检（每天刷新一次）
        working-directory: tvbox
        # 全量约 8 分钟，所以用 --max-age 控制成每天只跑一次，其余两次构建直接复用。
        # 结果里的 dead_streak 是「连续轮次」，构建只认 >=2，单轮超时不会误杀站点。
        run: python tools/probe_rules.py --all --jobs 24 --write --max-age 20

      - name: 播放链路体检（多分片实测，连续两轮才进稳定精选）
        working-directory: tvbox
        # 接口通不等于能播：首集是网盘分享页、分集地址带中文、分片 404 都会让用户
        # 「播放几秒闪退」。递归子清单并抽首/中/尾分片；连续两轮通过才进稳定精选。
        run: python tools/probe_play.py --all --jobs 16 --write

      - name: 抓取与合并
        working-directory: tvbox
        run: python build.py

      # GitHub Actions 的日志要登录才能看，失败时把 traceback 直接提交回仓库，
      # 免得每次只能对着「step failed」猜原因
      - name: 失败时提交错误日志
        if: failure()
        run: |
          if [ -f tvbox/last_error.txt ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -f tvbox/last_error.txt
            git commit -m "chore(tvbox): build error log"
            git push || true
          fi

      - name: 构建规则回归测试
        working-directory: tvbox
        run: python tools/selftest.py

      - name: 产物严格验收
        working-directory: tvbox
        # 字段合法不等于成品可用：同时检查核心类目、重复资源库和首页搜索。
        run: python tools/verify_schema.py && python tools/audit_lite.py

      - name: 抽样网络验收（仅告警）
        working-directory: tvbox
        run: python tools/validate.py
        continue-on-error: true

      - name: 构建摘要
        run: cat tvbox/report.md >> "$GITHUB_STEP_SUMMARY"

      - name: 提交产物
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tvbox
          if git diff --cached --quiet; then
            echo "产物无变化"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore(tvbox): rebuild $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # jsDelivr 按分支缓存 12 小时，推送后主动清理，避免手机端拿到旧配置
      - name: 刷新 CDN 缓存
        if: steps.commit.outputs.changed == 'true'
        run: |
          sleep 10
          for f in api/all.json api/lite.json index.json status.json report.md; do
            code=$(curl -sS -o /dev/null -w "%{http_code}" \
              "https://purge.jsdelivr.net/gh/josephgg/source@main/tvbox/$f" || echo "ERR")
            echo "$f -> $code"
          done

      # ---------------- JoeTV 聚合站 ----------------
      # 放在主产物提交之后，聚合层出问题时不会影响 TVBox 主配置的更新。
      # 上游目录取自本轮刚构建好的 api/lite.json + play_health.json + cms_alive.json。
      - name: 重建 JoeTV 上游目录
        working-directory: tvbox/joetv
        run: python tools/build_catalog.py

      - name: JoeTV 回归测试
        working-directory: tvbox/joetv
        # 含真实上游搜索/详情断言，上游抖动时会红；先修上游数据再看这里。
        run: node --test tests/worker.test.mjs

      - name: 打包 JoeTV 并生成配置
        working-directory: tvbox/joetv
        run: python tools/bundle.py && python tools/make_config.py

      - name: 提交 JoeTV 产物
        id: joetv
        run: |
          git add tvbox/api tvbox/joetv/data
          if git diff --cached --quiet; then
            echo "JoeTV 产物无变化"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore(joetv): rebuild $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # 需要仓库 Secrets 里的 CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID；
      # 没配就跳过部署，产物仍会正常提交，本地手动 deploy 即可。
      - name: 部署 JoeTV 到 Cloudflare Pages
        working-directory: tvbox/joetv
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "未配置 CLOUDFLARE_API_TOKEN，跳过 Pages 部署"
            exit 0
          fi
          npx --yes wrangler@4 pages deploy dist \
            --project-name joetv-joe --branch main --commit-dirty=true

